name: Deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - claude/premium-website-iu-ux-72a7bv

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL != '' && secrets.VERCEL || secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::No Vercel token found. Add a repository secret named VERCEL or VERCEL_TOKEN in Settings > Secrets and variables > Actions."
            exit 1
          fi
          DEPLOY_URL=$(npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" 2>deploy-err.log) || {
            echo "Deploy failed:"; cat deploy-err.log; exit 1;
          }
          echo "Deployment URL: $DEPLOY_URL"
          echo "### Deployed to Vercel :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "**Deployment URL:** $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"

          # Report the project's shareable domains (aliases), which are cleaner
          # than the per-deployment hash URL and stay stable across deploys.
          echo "--- Project domains ---"
          npx vercel@latest inspect "$DEPLOY_URL" --token "$VERCEL_TOKEN" 2>&1 | grep -iA10 "aliases" || true
          echo "--- All domains on this account ---"
          npx vercel@latest domains ls --token "$VERCEL_TOKEN" 2>&1 | tail -20 || true
